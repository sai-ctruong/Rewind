[project]
name = "aic2026-system"
version = "0.11.0"
description = "AIC 2026 preliminary-round retrieval system for KIS, Q&A, and TRAKE"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra -q"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = ["integration: optional real-model tests"]
