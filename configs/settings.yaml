# =============================================================================
# settings.yaml — Cấu hình trung tâm cho hệ thống AIC 2026
# =============================================================================
# Vì sao tập trung cấu hình vào 1 file:
#   Blueprint (CLAUDE.md Mục 1.1) đặt accuracy là ưu tiên số 1 và yêu cầu tinh
#   chỉnh tham số dựa trên BENCHMARK THỰC NGHIỆM (Mục 11.3), không phải số đoán.
#   Gom mọi ngưỡng vào một chỗ để khi có số đo thật ở Phase 3/5 chỉ cần sửa ở đây,
#   không phải đi lục từng module.
#
# QUY ƯỚC QUAN TRỌNG (đọc kỹ):
#   - Các mục đánh dấu [PROVISIONAL] là GIÁ TRỊ KHỞI TẠO TẠM cho Phase 0.
#     Theo Mục 11.3, KHÔNG được coi chúng là số cuối cùng — phải thay bằng kết
#     quả benchmark (recall/latency curve) đo ở Phase 3 (efSearch, top-K coarse)
#     và Phase 5 (top-K rerank, ngưỡng early-stop, time budget).
#   - Các mục đánh dấu [FIXED] là hằng số chuẩn trong lý thuyết (vd k=60 của RRF),
#     không cần benchmark.
# =============================================================================

# --- Phiên bản schema cấu hình (để module đọc biết mình đang parse đúng bản) ---
config_version: 1

# -----------------------------------------------------------------------------
# 1. INGESTION — Deduplication (Mục 5.1)
# -----------------------------------------------------------------------------
# Lý do có bước dedup: video lifelog có nhiều frame liên tiếp gần giống hệt nhau.
# Gộp chúng lại giảm 30-60% số vector cần index MÀ KHÔNG mất recall (các frame bị
# gộp gần như đồng nhất về ngữ nghĩa).
dedup:
  # [PROVISIONAL] Ngưỡng cosine similarity giữa 2 keyframe liên tiếp cùng video;
  # >= ngưỡng này thì gộp thành 1 cụm. 0.97 là điểm khởi đầu Blueprint đề nghị
  # (Mục 5.1). Cần kiểm chứng trên dữ liệu thật: quá cao -> gộp thiếu (phí vector),
  # quá thấp -> gộp nhầm frame khác ngữ nghĩa (MẤT RECALL — vi phạm Mục 1.2).
  similarity_threshold: 0.97

# -----------------------------------------------------------------------------
# 2. INGESTION — Embedding extraction (Mục 2.1, 5.2)
# -----------------------------------------------------------------------------
embedding:
  # Ensemble 2 encoder để giảm rủi ro "cùng sai" (correlated errors) — Mục 2.1.
  clip:
    # CLIP ViT-L/14 do BTC cấp sẵn feature -> không tốn compute trích xuất lại.
    model_name: "openai/clip-vit-base-patch32"
    dim: 512                     # AIC clip-features-32
  siglip:
    # SigLIP tự trích xuất (zero-shot tốt hơn CLIP ở benchmark retrieval — Mục 2.1).
    # Engine video (retrieval/video_engine.py) ENSEMBLE 2 encoder: siglip2-base +
    # siglip-base-multilingual. Đây là encoder chính (siglip2, 768-dim).
    model_name: "google/siglip2-base-patch16-256"
    model_name_2: "google/siglip-base-patch16-256-multilingual"  # encoder 2 (ensemble)
    dim: 768                     # [FIXED] siglip2-base-patch16-256 -> 768
  # [PROVISIONAL] Batch lớn + fp16 để tăng throughput ~40% (Mục 5.2). Điều chỉnh
  # theo VRAM thực tế ở Phase 2.
  batch_size: 256
  precision: "fp16"             # fp16 | bf16 | fp32

# -----------------------------------------------------------------------------
# 3. INGESTION — Vector index (Faiss HNSW) (Mục 2.2, 11.1)
# -----------------------------------------------------------------------------
# Quyết định Mục 2.2: Faiss HNSW cho tầng coarse (ưu tiên accuracy). Chỉ chuyển
# sang IVF-PQ nếu profiling Phase 3 cho thấy RAM là nút thắt THỰC SỰ.
index:
  type: "HNSW"                  # HNSW | IVF_PQ  (IVF_PQ chỉ bật sau khi đo RAM)
  hnsw:
    # [PROVISIONAL] M = số neighbor mỗi node lúc build. Giá trị chuẩn hay dùng
    # 16-64; càng cao càng chính xác nhưng tốn RAM/thời gian build. Chốt ở Phase 3.
    M: 32
    # [PROVISIONAL] efConstruction — độ rộng tìm kiếm lúc build index.
    ef_construction: 200
    # [ĐO 2026-07-15 — evaluation/bench_scale.py, xem benchmarks/scale_ef_sweep.json]
    # efSearch — độ rộng chùm tìm kiếm lúc query. ĐÃ đo đúng như Mục 11.1.2 yêu cầu
    # (đường cong recall/latency, 768 chiều, dữ liệu mô phỏng embedding thật):
    #
    #   200k vector, k=10:   ef=128 -> recall 0.394 (0.6ms) | ef=1024 -> 0.859 (4.7ms)
    #                        ef=2048 -> recall 0.967 (11.8ms)
    #   100k vector, k=100:  ef=128 -> recall 0.465 (0.6ms) | ef=2048 -> 0.981 (11.1ms)
    #
    # VÌ SAO 2048 chứ không phải "điểm khuỷu tay" 1024: khuỷu tay chỉ đáng theo khi
    # latency là tài nguyên khan hiếm — ở đây KHÔNG. 11ms chiếm ~0.05% time_budget 20s,
    # và nhỏ hơn VLM rerank (~1s/ứng viên) hai bậc độ lớn. Trong khi đó Mục 1.2 nói
    # ứng viên bị loại ở coarse KHÔNG BAO GIỜ được xét lại -> mua recall bằng vài ms
    # là món hời. ef=128 cũ làm MẤT ~54% top-100 đúng, vi phạm chính ràng buộc đó.
    #
    # QUY TẮC: efSearch nên >= ~2x coarse.top_k (đang là 1000) -> 2048.
    ef_search: 2048
  # Ngưỡng số lượng vector mà trên đó CẤM brute-force linear scan (Mục 1.3).
  # Vượt mức này bắt buộc phải dùng ANN (HNSW/IVF-PQ).
  brute_force_max_vectors: 50000  # [FIXED] theo ràng buộc Mục 1.3

# -----------------------------------------------------------------------------
# 4. RETRIEVAL — Coarse (recall-first) (Mục 3, 4.2, 1.2)
# -----------------------------------------------------------------------------
coarse:
  # [PROVISIONAL] Số candidate lấy ra ở tầng coarse. Blueprint Phase 0 đặt 1000.
  # Ưu tiên RECALL (Mục 1.2): thà lấy dư còn hơn loại nhầm ứng viên đúng, vì frame
  # bị loại ở đây KHÔNG BAO GIỜ được xét lại. Tinh chỉnh theo recall@K ở Phase 3/5.
  top_k: 1000
  # Multi-Query Expansion (Mục 4.2): sinh 3-5 biến thể diễn đạt để tăng recall.
  query_expansion:
    enabled: true
    num_variants: 4              # [PROVISIONAL] trong khoảng 3-5 theo Mục 4.2
    # Cách hợp nhất nhiều biến thể: "weighted_avg_embedding" hoặc "union_results".
    fusion_strategy: "union_results"

# -----------------------------------------------------------------------------
# 5. RETRIEVAL — Score Fusion (RRF) (Mục 4.3)
# -----------------------------------------------------------------------------
fusion:
  clip_weight: 1.0
  object_weight: 0.20
  metadata_weight: 0.10
  sparse_weight: 0.25
  adaptive: true
  method: "RRF"                 # Reciprocal Rank Fusion — chuẩn IR cho việc gộp
                                 # nhiều ranked list khác đơn vị đo (CLIP/BM25/meta).
  # [FIXED] Hằng số k trong công thức RRF_score = Σ 1/(k + rank). k=60 là mặc định
  # chuẩn trong tài liệu IR (Mục 4.3).
  rrf_k: 60
  # [ĐO 2026-07-16 — bench_retrieval.py --fusion-depth, 51 nhãn/2679 kf] Độ sâu fusion:
  clip_weight: 1.0
  object_weight: 0.20
  metadata_weight: 0.10
  sparse_weight: 0.25
  adaptive: true
  # mỗi nguồn (clip/siglip/bm25) đóng góp bấy nhiêu rank vào RRF.
  #
  # PHẢI TÁCH RIÊNG khỏi "số kết quả trả về". Bug đã đo: khi hai thứ này là MỘT tham
  # số, xin top_k=20 thay vì 5 làm hit@5 tụt 0.627 -> 0.510 (cùng query, cùng index) —
  # vì list sâu hơn khiến item được cộng điểm RRF từ nhiều nguồn hơn, đổi cả thứ hạng.
  #
  # GIÁ TRỊ 1000 giữ nguyên vì KHÔNG CÓ BẰNG CHỨNG để đổi, chứ không phải vì đã tối ưu:
  #   depth   5: hit@1 0.431 · hit@5 0.667
  #   depth  50: hit@1 0.490 · hit@5 0.628
  #   depth 100/300/1000: hit@1 0.471 · hit@5 0.608  (GIỐNG HỆT NHAU — quá 100 bão hoà)
  # Trông như đánh đổi (sâu -> hit@1 tăng, hit@5 giảm) nhưng McNemar theo cặp: p >= 0.625
  # cho hit@1. Với hit@5, chênh lệch LỚN NHẤT toàn bảng chỉ là 3 query -> kể cả khi cả 3
  # cùng nghiêng một phía thì p = 0.25. Tức thí nghiệm này KHÔNG ĐỦ LỰC để phát hiện
  # (cần >= 6 cặp bất đồng). Đừng chỉnh số này dựa trên bảng trên — hãy tăng số nhãn
  # trước (task C1). Độ trễ như nhau ở mọi độ sâu (~0.065s/query) nên không có lý do
  # tốc độ để hạ xuống.
  depth: 1000
  # Số candidate giữ lại sau fusion trước khi vào fine rerank (Mục 3, bước [3]).
  top_k_after_fusion: 100       # [PROVISIONAL]

# -----------------------------------------------------------------------------
# 6. RETRIEVAL — Fine Rerank (LVLM verifier) (Mục 2.3, 4.4, 11.1)
# -----------------------------------------------------------------------------
# Ràng buộc THỰC SỰ ở đây là ĐỘ TRỄ trong time budget vòng thi, KHÔNG phải chi phí
# (BTC cấp API miễn phí) — Mục 2.3, 4.4.
fine_rerank:
  enabled: true
  # [PROVISIONAL] Số candidate đưa vào LVLM rerank. Blueprint Phase 0 đặt 100;
  # Mục 4.4 nói có thể nâng 200-300 vì API miễn phí, MIỄN vừa time budget. Con số
  # cuối cùng phải suy ra ngược từ giây/candidate đo thực nghiệm ở Phase 5.
  top_k: 100
  # Batch nhiều candidate/request để giảm round-trip mạng (giảm ĐỘ TRỄ) — Mục 4.4.
  batch_size: 8                 # [PROVISIONAL]
  # Early stopping: dừng sớm khi Top-1 vượt trội rõ rệt.
  early_stopping:
    enabled: true
    # [PROVISIONAL] ngưỡng tự tin để dừng sớm — chốt bằng thực nghiệm Phase 5.
    confidence_margin: 0.15
  # Số kết quả cuối trả sau rerank (Mục 3, bước [4] -> top 20).
  top_k_final: 20               # [PROVISIONAL]

# -----------------------------------------------------------------------------
# 7. RETRIEVAL — Time budget (Mục 4.4)
# -----------------------------------------------------------------------------
# LƯU Ý: time_budget là NGÂN SÁCH ĐỘ TRỄ online lúc thi, dùng để suy ra top-K
# rerank tối đa. KHÔNG áp cho giai đoạn indexing (offline, không giới hạn — Mục 2.3).
runtime:
  production_mode: false
  seed: 42
  device: "auto"
  # [PROVISIONAL] Blueprint Phase 0 đặt 20s. Đây là tổng thời gian tối đa cho 1
  # query online. Phải kiểm bằng đo thực nghiệm ở Phase 5 (Mục 4.4).
  time_budget_seconds: 20
  # Số lời gọi LVLM đồng thời (concurrent) — bị chặn bởi rate limit API, KHÔNG
  # phải chi phí (Mục 11.1.5). Chốt theo rate limit thực tế.
  max_concurrent_lvlm_calls: 8  # [PROVISIONAL]

# -----------------------------------------------------------------------------
# 9. LLM / LVLM API (Claude) (Mục 2.3, 2.4)
# -----------------------------------------------------------------------------
llm:
  # Model dùng cho Query Understanding / Expansion (text) và caption/rerank (vision).
  # Dùng ID model mới nhất theo hướng dẫn môi trường; xác nhận lại khi cắm API thật.
  text_model: "claude-sonnet-5"
  vision_model: "claude-opus-4-8"
  # Khóa API đọc từ biến môi trường, KHÔNG hard-code trong repo.
  api_key_env: "ANTHROPIC_API_KEY"

# -----------------------------------------------------------------------------
# 10. Đường dẫn dữ liệu (điền khi có dữ liệu BTC thật ở Phase 2+)
# -----------------------------------------------------------------------------
paths:
  clip_features_dir: null       # thư mục feature CLIP BTC cấp sẵn
  keyframes_dir: null           # thư mục ảnh keyframe gốc
  objects_dir: null             # metadata object (Open Images 600 categories)
  index_dir: "artifacts/index"  # nơi lưu Faiss index + BM25 sau build (Phase 3)
  benchmark_dir: "evaluation/benchmarks"  # nơi lưu recall/latency curve (Mục 11.3)

# -----------------------------------------------------------------------------
# 11. VIDEO SEARCH ENGINE (retrieval/video_engine.py) — GIÁ TRỊ ĐÃ BENCHMARK
# -----------------------------------------------------------------------------
# LƯU Ý: đây là bản GHI LẠI quyết định đã đo (nguồn sự thật là DEFAULT trong
# retrieval/video_engine.py — engine hiện KHÔNG parse file này; giữ đồng bộ tay).
# Benchmark: RTX 3060, 3 video data/videos/, 37 nhãn evaluation/labels.json.
# Đường cong đầy đủ + bảng: xem TASKS.md mục B1 và evaluation/benchmarks/.
video_engine:
  # [ĐO 2026-07-12] Lấy mẫu 1 frame/giây: hit@5 phẳng 0.68 ở 2.0/1.0/0.5s (recall
  # bị chặn bởi ENCODER, không phải lấy mẫu). 0.5s tăng hit@1 (0.36 vs 0.28) nhưng
  # index ×2. Chọn 1.0s cân bằng; đổi 0.5s nếu ưu tiên KIS top-1 và chịu được index.
  sample_every_s: 1.0
  max_frames: null              # null = quét TOÀN BỘ video (không giới hạn frame)
  # [ĐO 2026-07-12] Trọng số BM25 (OCR/ASR/chữ) trong RRF. 1.0 tối ưu recall (hit@5
  # 0.72); 3.0 HẠI recall (0.52) vì chữ biển hiệu khớp nhầm query thị giác; 0 = dense
  # -only (0.68). ADAPTIVE bật: query có token IN HOA (tên biển) -> dùng bm25_weight_high.
  bm25_weight: 1.0
  adaptive_bm25: true
  bm25_weight_high: 3.0         # dùng cho query CHỮ (tên biển hiệu IN HOA)
  # [ĐO 2026-07-12] VLM rerank (Qwen2-VL-2B): hit@1 0.35 -> 0.60, nhưng ~24s/query
  # -> CHỈ dùng cho KIS (top-K nhỏ), KHÔNG cho AVS. Không OOM trên 6GB VRAM.
  rerank_pool: 8
  # A1 batch embedding: ×2.15 sau khi luồng hoá load ảnh (nút thắt = tiền xử lý CPU,
  # không phải GPU). Xem TASKS.md mục A1.
  embed_batch_size: 256
  enable_ocr: true
  enable_asr: false             # Whisper nặng, opt-in (cần openai-whisper + ffmpeg)
  # A3 decode: "auto" ưu tiên decord/NVDEC nếu cài, else cv2 (chỉ decode frame lấy mẫu).
  decode_backend: "auto"
# AIC 2026 competition pipeline. Values are starting points until measured on one label split.
encoder:
  type: "clip"
  model_name: "openai/clip-vit-base-patch32"
  normalize: true
  batch_size: 32
  allow_hashing_fallback: true

ranking:
  top_k: 100
  max_frames_per_video: 12
  min_frame_gap: 30
  neighbor_offsets: [-2, -1, 1, 2]
  diversity_lambda: 0.25
  precision_head_size: 5
  recall_tail_size: 50

refinement:
  enabled: true
  mode: uncertainty
  margin_threshold: 0.03
  candidate_budget: 5
  window_before_s: 4.0
  window_after_s: 4.0
  fine_fps: 4.0
  max_frames: 32
  cache_size_mb: 256

trake:
  per_event_top_k: 40
  top_video_hypotheses: 20
  min_gap_s: 0.001
  max_gap_s: null
  coverage_bonus: 0.20
  missing_event_penalty: 0.35
  transition_penalty: 0.02
  local_refinement: true

qa:
  evidence_frame_count: 8
  retrieval_query_mode: "event_only"
  answer_confidence_threshold: 0.35
  abstain_enabled: true

evaluation:
  ks: [1, 5, 20, 50, 100]
  output_dir: "evaluation/benchmarks/aic2026"
  save_predictions: true
  save_errors: true
# -----------------------------------------------------------------------------
# AIC 2026 runtime config used by aic2026.config.AppConfig.
# Legacy top-level sections above are retained for older modules/tests.
# -----------------------------------------------------------------------------
aic2026:
  runtime:
    production_mode: false
    seed: 42
    device: auto
    time_budget_seconds: 20

  dataset:
    root: data
    cache_dir: artifacts/aic2026_index
    # Frames decoded from the original MP4s when a BTC keyframe JPEG is absent. These
    # are DERIVED artifacts: disposable, outside DATA_ROOT, and never part of the
    # retrieval cache manifest.
    frame_cache_dir: artifacts/video_frame_cache
    load_objects: false
    include_media_text: false
    verify_keyframes: false
    index_kind: flat
    # Which canonical video IDs form the active dataset. Defaults to the full L21-L30
    # collection. To develop on a subset, override on the command line instead of
    # editing this file, for example:
    #   --video-include "L21_*"        --cache-dir artifacts/aic2026_index_L21
    #   --scope-existing-videos        --cache-dir artifacts/aic2026_index_existing_videos
    # Sources outside the selected scope are reported as excluded, never as missing.
    # mode: patterns | existing_videos (MP4 on disk AND map + CLIP present).
    scope:
      mode: patterns
      include_patterns:
        - "*"
      exclude_patterns: []
    validation:
      strict_alignment: true
      # BTC keyframe JPEGs are SUPPORTING data: their absence never blocks the
      # official-CLIP global index. Set true only to demand that every selected video
      # has at least one visual source (keyframe JPEG or original MP4).
      require_visual_source: false
      strict_objects: false
      verify_feature_finite: true
      verify_feature_norms: true
      verify_image_decode: false
      max_image_decode_checks_per_video: null
      supported_feature_dtypes: [float16, float32]
      expected_feature_dim: 512

  cache:
    allow_stale_cache: false
    validate_data_signature: true
    code_version_policy: warn

  encoder:
    type: auto_clip
    model_name: openai/clip-vit-base-patch32
    feature_dim: 512
    normalize: true
    batch_size: 32
    allow_hashing_fallback: true

  retrieval_channels:
    clip_enabled: true
    clip_top_k: 1200
    bm25_enabled: true
    bm25_top_k: 800
    objects_enabled: true
    objects_top_k: 800
    object_confidence_threshold: 0.25
    metadata_enabled: true
    metadata_top_k: 300

  fusion:
    method: adaptive
    clip_weight: 1.0
    object_weight: 0.20
    metadata_weight: 0.10
    sparse_weight: 0.25
    rrf_k: 60
    adaptive: true

  ranking:
    final_top_k: 100
    max_frames_per_video: 12
    min_frame_gap: 30
    neighbor_offsets: [-2, -1, 1, 2]
    diversity_lambda: 0.25
    precision_head_size: 5
    recall_tail_size: 50

  refinement:
    enabled: true
    # always | uncertainty | disabled.
    mode: uncertainty
    # Coarse candidates examined when forming local regions...
    top_hypotheses: 10
    # ...and how many regions may actually be decoded and scored per query.
    candidate_budget: 5
    # Candidates of one video closer than this are one region, so the budget is not
    # spent twice on overlapping windows.
    region_merge_s: 1.0
    window_before_s: 4.0
    window_after_s: 4.0
    fine_fps: 4.0
    max_frames: 32
    batch_size: 16
    cache_size_mb: 256
    scorer_input_max_side: 336
    # refined = coarse_fusion_score + rerank_alpha * (best_visual - coarse_visual).
    # NOT tuned against accuracy: this repository has no AIC ground truth.
    rerank_alpha: 0.10
    # preserve_coarse keeps the official mapped frame_idx as the submitted frame even
    # when a different local frame scores higher. Do not change this until AIC confirms
    # the frame-ID semantics of an arbitrary decoded frame.
    frame_output_policy: preserve_coarse
    trigger:
      margin_threshold: 0.03
    scorer:
      type: clip
      model_name: openai/clip-vit-base-patch32
      device: auto
      # true = fail loudly instead of silently skipping refinement.
      required: false

  trake:
    alignment_method: beam_dp
    per_event_top_k: 40
    top_video_hypotheses: 20
    alignments_per_video: 1
    beam_width: 8
    min_gap_s: 0.001
    max_gap_s: null
    coverage_bonus: 0.20
    missing_event_penalty: 0.35
    transition_penalty: 0.02
    gap_penalty: 0.001
    sequence_overlap_threshold: 0.8
    final_top_k: 100

  qa:
    top_video_hypotheses: 8
    frame_hypotheses_per_video: 3
    evidence_frame_count: 8
    answerer_batch_size: 1
    max_answers: 100
    retrieval_query_mode: event_only
    answer_confidence_threshold: 0.35
    abstain_enabled: true
    default_answer_type: auto

  submission:
    max_predictions: 100
    max_answers: 100

  evaluation:
    ks: [1, 5, 20, 50, 100]
    output_dir: evaluation/benchmarks/aic2026
    save_predictions: true
    save_errors: true

  ui:
    enabled: true