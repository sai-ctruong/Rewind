<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 8" width="1200" height="8" role="presentation">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d5efc" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#6d5efc" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="3" width="1200" height="2" rx="1" fill="url(#base)"/>
  <rect y="2" width="240" height="4" rx="2" fill="url(#shimmer)">
    <animate attributeName="x" values="-240;1200" dur="3.5s" repeatCount="indefinite"/>
  </rect>
</svg>
