<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Bo loc anh: 20 -> 8 -> 3 -> 1">
  <defs>
    <linearGradient id="bgf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#111735"/>
    </linearGradient>
    <linearGradient id="thumb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4a7a"/><stop offset="1" stop-color="#243056"/>
    </linearGradient>
    <linearGradient id="hit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c6cff"/><stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <style>
      .lab { font-family: "Segoe UI", Arial, sans-serif; }
      .num { font-family: "Segoe UI", Arial, sans-serif; font-weight: 800; }
      .mono{ font-family: Consolas, "SF Mono", monospace; }
    </style>
  </defs>
  <rect width="1200" height="320" fill="url(#bgf)"/>

  <!-- tieu de + buoc hien tai -->
  <text class="lab" x="60" y="46" font-size="19" font-weight="700" fill="#e6ecff">Bộ lọc ảnh — lưới co lại theo từng lượt</text>
  <g class="mono" font-size="14" fill="#93a1c9">
    <text x="60" y="72" opacity="0">
      “cảnh đường phố”
      <animate attributeName="opacity" values="0;1;1;0;0;0;0" keyTimes="0;0.04;0.22;0.28;0.9;0.99;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="60" y="72" opacity="0">
      + “áo trắng”
      <animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;0.28;0.32;0.47;0.53;0.99;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="60" y="72" opacity="0">
      + 👍 phản hồi
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.53;0.57;0.72;0.78;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="60" y="72" opacity="0">
      → đúng khoảnh khắc
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.78;0.82;0.97;1" dur="9s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- luoi 20 thumbnail: dim dan theo tung pha -->
  <g>
    <!-- G1: bi loc o luot 1 (12 anh) -->
    <g fill="url(#thumb)">
      <g>
        <animate attributeName="opacity" values="1;1;0.09;0.09;1" keyTimes="0;0.22;0.3;0.98;1" dur="9s" repeatCount="indefinite"/>
        <rect x="60"  y="110" width="92" height="54" rx="7"/>
        <rect x="260" y="110" width="92" height="54" rx="7"/>
        <rect x="360" y="110" width="92" height="54" rx="7"/>
        <rect x="560" y="110" width="92" height="54" rx="7"/>
        <rect x="660" y="110" width="92" height="54" rx="7"/>
        <rect x="860" y="110" width="92" height="54" rx="7"/>
        <rect x="60"  y="180" width="92" height="54" rx="7"/>
        <rect x="160" y="180" width="92" height="54" rx="7"/>
        <rect x="460" y="180" width="92" height="54" rx="7"/>
        <rect x="660" y="180" width="92" height="54" rx="7"/>
        <rect x="760" y="180" width="92" height="54" rx="7"/>
        <rect x="860" y="180" width="92" height="54" rx="7"/>
      </g>
    </g>
    <!-- G2: bi loc o luot 2 (5 anh) -->
    <g fill="url(#thumb)">
      <g>
        <animate attributeName="opacity" values="1;1;0.09;0.09;1" keyTimes="0;0.47;0.55;0.98;1" dur="9s" repeatCount="indefinite"/>
        <rect x="160" y="110" width="92" height="54" rx="7"/>
        <rect x="460" y="110" width="92" height="54" rx="7"/>
        <rect x="760" y="110" width="92" height="54" rx="7"/>
        <rect x="260" y="180" width="92" height="54" rx="7"/>
        <rect x="560" y="180" width="92" height="54" rx="7"/>
      </g>
    </g>
    <!-- G3: bi loc o luot 3 (2 anh) -->
    <g fill="url(#thumb)">
      <g>
        <animate attributeName="opacity" values="1;1;0.09;0.09;1" keyTimes="0;0.72;0.8;0.98;1" dur="9s" repeatCount="indefinite"/>
        <rect x="960" y="110" width="92" height="54" rx="7"/>
        <rect x="360" y="180" width="92" height="54" rx="7"/>
      </g>
    </g>
    <!-- G4: song sot -->
    <g>
      <rect x="960" y="180" width="92" height="54" rx="7" fill="url(#thumb)"/>
      <rect x="960" y="180" width="92" height="54" rx="7" fill="url(#hit)" opacity="0">
        <animate attributeName="opacity" values="0;0;0.95;0.95;0" keyTimes="0;0.78;0.84;0.97;1" dur="9s" repeatCount="indefinite"/>
      </rect>
      <rect x="957" y="177" width="98" height="60" rx="9" fill="none" stroke="#7cf7c4" stroke-width="0" >
        <animate attributeName="stroke-width" values="0;0;3;3;0" keyTimes="0;0.78;0.84;0.97;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- bo dem lon -->
  <g text-anchor="middle">
    <text class="lab" x="1120" y="120" font-size="12" fill="#93a1c9" letter-spacing="1">CÒN LẠI</text>
    <g class="num" font-size="60" fill="#e6ecff">
      <text x="1120" y="185" opacity="0">20<animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;0.26;0.3;0.97;0.99;1" dur="9s" repeatCount="indefinite"/></text>
      <text x="1120" y="185" opacity="0">8<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.34;0.51;0.55;1" dur="9s" repeatCount="indefinite"/></text>
      <text x="1120" y="185" opacity="0">3<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.59;0.76;0.8;1" dur="9s" repeatCount="indefinite"/></text>
      <text x="1120" y="185" fill="#7cf7c4" opacity="0">1<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.8;0.84;0.97;1" dur="9s" repeatCount="indefinite"/></text>
    </g>
    <!-- thanh thu hep -->
    <rect x="1060" y="210" width="120" height="6" rx="3" fill="#243056"/>
    <rect x="1060" y="210" width="120" height="6" rx="3" fill="url(#hit)">
      <animate attributeName="width" values="120;120;48;48;18;18;6;6;120" keyTimes="0;0.26;0.34;0.55;0.6;0.78;0.84;0.98;1" dur="9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text class="mono" x="60" y="278" font-size="13" fill="#6b7aa3">thêm mô tả · 👍/👎 (Rocchio) · chọn ảnh gần ý nhất — dùng lẫn nhau tuỳ ý</text>
</svg>
