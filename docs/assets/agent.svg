<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Agent tu chon cong cu: understand -> search_temporal">
  <defs>
    <linearGradient id="bga" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#141a33"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c6cff"/><stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <style>
      .t  { font-family: "Segoe UI", Arial, sans-serif; }
      .m  { font-family: Consolas, "SF Mono", monospace; }
    </style>
  </defs>
  <rect width="1200" height="300" fill="url(#bga)"/>

  <text class="t" x="60" y="44" font-size="19" font-weight="700" fill="#e6ecff">Agent tự chọn cách tìm — và cho bạn xem nó nghĩ gì</text>

  <!-- cau hoi cua nguoi dung -->
  <g>
    <rect x="60" y="70" width="470" height="44" rx="10" fill="#1c2445" stroke="#2b3350"/>
    <text class="m" x="80" y="98" font-size="14" fill="#c7d2fe">“người cởi mũ trước khi vào phòng”</text>
  </g>

  <!-- chuoi cong cu: sang dan theo thu tu -->
  <g>
    <!-- 1. understand -->
    <g opacity="0.25">
      <animate attributeName="opacity" values="0.25;1;1;1;1;0.25" keyTimes="0;0.14;0.5;0.86;0.95;1" dur="8s" repeatCount="indefinite"/>
      <rect x="60" y="150" width="210" height="62" rx="10" fill="#161d3a" stroke="url(#chip)" stroke-width="1.5"/>
      <text class="m" x="78" y="176" font-size="14" font-weight="700" fill="#a78bfa">understand</text>
      <text class="t" x="78" y="197" font-size="11.5" fill="#8a94bb">phân tích để định tuyến</text>
    </g>

    <!-- mui ten 1 -->
    <text class="m" x="288" y="188" font-size="20" fill="#7c6cff" opacity="0">
      →<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.28;0.34;0.95;1" dur="8s" repeatCount="indefinite"/>
    </text>

    <!-- 2. search_temporal -->
    <g opacity="0.25">
      <animate attributeName="opacity" values="0.25;0.25;1;1;1;0.25" keyTimes="0;0.34;0.44;0.86;0.95;1" dur="8s" repeatCount="indefinite"/>
      <rect x="320" y="150" width="270" height="62" rx="10" fill="#161d3a" stroke="url(#chip)" stroke-width="1.5"/>
      <text class="m" x="338" y="176" font-size="14" font-weight="700" fill="#38bdf8">search_temporal</text>
      <text class="t" x="338" y="197" font-size="11.5" fill="#8a94bb">câu có THỨ TỰ thời gian → tìm chuỗi</text>
    </g>

    <!-- mui ten 2 -->
    <text class="m" x="608" y="188" font-size="20" fill="#7c6cff" opacity="0">
      →<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.56;0.62;0.95;1" dur="8s" repeatCount="indefinite"/>
    </text>

    <!-- 3. ket qua chuoi -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.62;0.7;0.95;1" dur="8s" repeatCount="indefinite"/>
      <rect x="640" y="146" width="120" height="70" rx="8" fill="#243056"/>
      <text class="m" x="700" y="234" font-size="11" fill="#8a94bb" text-anchor="middle">cởi mũ · 0.0s</text>
      <text class="m" x="778" y="188" font-size="18" fill="#7cf7c4">→</text>
      <rect x="800" y="146" width="120" height="70" rx="8" fill="#243056"/>
      <text class="m" x="860" y="234" font-size="11" fill="#8a94bb" text-anchor="middle">vào phòng · 7.0s</text>
      <rect x="637" y="143" width="126" height="76" rx="10" fill="none" stroke="#7cf7c4" stroke-width="2"/>
      <rect x="797" y="143" width="126" height="76" rx="10" fill="none" stroke="#7cf7c4" stroke-width="2"/>
    </g>

    <!-- ghi chu: dung thu tu -->
    <text class="t" x="960" y="180" font-size="13" fill="#7cf7c4" opacity="0">
      ✓ đúng thứ tự thời gian
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.7;0.78;0.95;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <text class="t" x="960" y="202" font-size="12" fill="#8a94bb" opacity="0">
      cùng video · timestamp tăng dần
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.7;0.78;0.95;1" dur="8s" repeatCount="indefinite"/>
    </text>
  </g>

  <text class="m" x="60" y="272" font-size="13" fill="#6b7aa3">bạn gõ 1 câu · Agent tự định tuyến · nhớ phản hồi xuyên lượt · trả lời kèm trích dẫn keyframe</text>
</svg>
