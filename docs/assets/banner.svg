<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Rewind - Tua lai tim khoanh khac">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#141a33"/>
      <stop offset="1" stop-color="#0a0f1f"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#38bdf8"/>
      <animate attributeName="x1" values="0;0.4;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;1.4;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6d5efc" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6d5efc" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <style>
      .wm   { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-weight: 800; }
      .sub  { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-weight: 600; letter-spacing: .5px; }
      .tick { stroke: #6b7280; stroke-width: 2; }
      @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      .center { animation: floaty 6s ease-in-out infinite; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1200" height="360" fill="url(#bg)"/>
  <ellipse cx="600" cy="150" rx="440" ry="180" fill="url(#glow)">
    <animate attributeName="rx" values="440;480;440" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;1;0.8" dur="7s" repeatCount="indefinite"/>
  </ellipse>

  <!-- drifting particles -->
  <g fill="#8b93ff" opacity="0.5">
    <circle cx="140" cy="80" r="2.5"><animate attributeName="cy" values="80;70;80" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="110" r="2"><animate attributeName="cy" values="110;100;110" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="60" r="2.5"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="120" r="2"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="5.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- center wordmark -->
  <g class="center">
    <!-- rewind glyph ◀◀ -->
    <g transform="translate(322 132)">
      <path d="M46 0 L8 24 L46 48 Z" fill="url(#ink)">
        <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
      </path>
      <path d="M92 0 L54 24 L92 48 Z" fill="url(#ink)">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="1.6s" repeatCount="indefinite"/>
      </path>
    </g>
    <text class="wm" x="440" y="172" font-size="104" fill="url(#ink)">Rewind</text>
    <text class="sub" x="600" y="228" font-size="30" fill="#c7d2fe" text-anchor="middle">Tua lại tìm khoảnh khắc</text>
  </g>

  <!-- scrub timeline -->
  <g transform="translate(0 296)">
    <line x1="150" y1="0" x2="1050" y2="0" stroke="#2b3350" stroke-width="4" stroke-linecap="round"/>
    <g class="tick">
      <line x1="210" y1="-7" x2="210" y2="7"/><line x1="300" y1="-7" x2="300" y2="7"/>
      <line x1="390" y1="-7" x2="390" y2="7"/><line x1="480" y1="-7" x2="480" y2="7"/>
      <line x1="570" y1="-7" x2="570" y2="7"/><line x1="660" y1="-7" x2="660" y2="7"/>
      <line x1="750" y1="-7" x2="750" y2="7"/><line x1="840" y1="-7" x2="840" y2="7"/>
      <line x1="930" y1="-7" x2="930" y2="7"/>
    </g>
    <!-- progress trail that shrinks (rewinding) -->
    <line x1="150" y1="0" x2="1050" y2="0" stroke="url(#ink)" stroke-width="4" stroke-linecap="round">
      <animate attributeName="x2" values="1050;150;1050" keyTimes="0;0.7;1" dur="4s" repeatCount="indefinite"/>
    </line>
    <!-- playhead sweeping right -> left, then snapping back -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="1050 0; 150 0; 1050 0" keyTimes="0;0.7;1" dur="4s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="12" fill="#fff" filter="url(#soft)" opacity="0.6"/>
      <circle cx="0" cy="0" r="7" fill="#e0e7ff"/>
    </g>
  </g>
</svg>
